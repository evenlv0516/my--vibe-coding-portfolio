<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>玄玑使用指南</title>
  <style>
    :root {
      --sidebar-w: 264px;
      --header-pad: 24px;
      --primary: #3877f5;
      --primary-dark: #2563eb;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --feedback: #f97316;
      --topnav-height: 56px;
      --font: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: var(--font);
      background: #fff;
      color: var(--text);
    }
    .topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(12px);
      box-shadow: 0 2px 16px rgba(30, 41, 59, 0.06);
      border-bottom: 1px solid var(--border);
    }
    .header-inner {
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: var(--topnav-height);
      width: 100%;
      gap: 16px;
    }
    .header-left {
      display: flex;
      align-items: center;
      min-width: 0;
      flex: 1;
      height: 100%;
      gap: 0;
    }
    .header-leading {
      flex: 0 0 calc(var(--sidebar-w) - var(--header-pad));
      max-width: calc(var(--sidebar-w) - var(--header-pad));
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      box-sizing: border-box;
    }

    .topnav-brand {
      display: flex;
      align-items: center;
      flex-shrink: 0;
      text-decoration: none;
      height: 100%;
      padding-right: 0;
    }
    .topnav-brand .ecovacs-logo {
      height: 28px;
      width: auto;
      display: block;
    }

    .brand-divider {
      width: 1px; height: 20px; background: #E2E8F0; flex-shrink: 0;
    }
    .guide-brand {
      display: inline-flex; align-items: center; gap: 6px;
      min-width: 0; flex-shrink: 0;
      text-decoration: none;
      margin: 0; padding: 0;
      user-select: none;
    }
    .guide-brand-ico {
      width: 16px; height: 16px; display: block; flex-shrink: 0;
      color: #2484C6;
    }
    .guide-brand-text {
      font-size: 14px; font-weight: 600; line-height: 1.2;
      white-space: nowrap;
      background-image: linear-gradient(135deg, #2484C6 0%, #1C2D5A 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
    }



    .header-right {
      display: flex; align-items: center; gap: 8px; flex-shrink: 0; height: 100%;
      margin-left: 12px;
    }
    .header-right a {
      display: inline-flex; align-items: center; gap: 6px;
      height: 32px; box-sizing: border-box;
      text-decoration: none; font-size: 14px; font-weight: 400;
      white-space: nowrap; line-height: 1;
      padding: 0 12px; border-radius: 8px;
      transition: background-color 0.15s ease, color 0.15s ease;
    }
    .header-right .feedback {
      color: #D46B08;
    }
    .header-right .feedback:hover {
      background: #FFF7E8;
      opacity: 1;
    }
    .header-right .feedback-ico,
    .header-right .feedback svg {
      width: 16px; height: 16px; flex-shrink: 0; display: block;
    }
    .header-right .back-xuanji {
      color: #4E5969;
    }
    .header-right .back-xuanji:hover {
      background: #F5F7FA;
      opacity: 1;
    }


    .nav-bar {
      display: flex;
      align-items: center;
      min-width: 0;
      height: 100%;
    }
    .nav-list {
      list-style: none;
      display: flex;
      align-items: center;
      margin: 0;
      gap: 0;
      height: 100%;
    }
    .nav-list a {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: var(--topnav-height);
      padding: 0 14px;
      color: var(--text);
      text-decoration: none;
      font-size: 14px;
      cursor: pointer;
      white-space: nowrap;
      transition: color 0.2s;
      background: transparent;
      border: 0;
      font-family: inherit;
    }
    .nav-list a:hover { color: var(--primary-dark); }
    .nav-list a.active {
      color: var(--primary);
      font-weight: 600;
    }
    @media (max-width: 900px) {
      .header-leading {
        flex: 0 1 auto;
        max-width: none;
      }

      .header-inner { padding: 0 16px; }
      .nav-list a { padding: 0 10px; }
      .header-right { gap: 12px; }
    }

    .frame-wrap {
      position: fixed;
      top: var(--topnav-height);
      left: 0; right: 0; bottom: 0;
      background: #fff;
      overflow: hidden;
    }
    .frame-wrap iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #fff;
      opacity: 0;
      pointer-events: none;
      z-index: 0;
      transition: opacity 0.28s ease;
    }
    .frame-wrap iframe.is-active {
      opacity: 1;
      pointer-events: auto;
      z-index: 1;
    }
    .nav-list a {
      transition: color 0.2s ease;
    }
    .nav-list a.active {
      color: var(--primary);
      font-weight: 600;
    }
    .nav-list a.active::after {
      content: "";
      position: absolute;
      left: 14px; right: 14px;
      bottom: 0;
      height: 2px;
      background: var(--primary);
      border-radius: 1px 1px 0 0;
    }
    @media (prefers-reduced-motion: reduce) {
      .frame-wrap iframe {
        transition: none;
      }
    }
  </style>
</head>

  <div class="frame-wrap" id="frameWrap">
    <iframe class="is-active" data-top="ai" title="AI管理能力" src="AI管理能力功能.html"></iframe>

  </div>
  <script>
    (function () {
      var tabs = document.getElementById("topTabs");
      var wrap = document.getElementById("frameWrap");
      if (!tabs || !wrap) return;

      var frames = Array.prototype.slice.call(wrap.querySelectorAll("iframe[data-top]"));
      var frameMap = {};
      frames.forEach(function (frame) {
        frameMap[frame.getAttribute("data-top")] = frame;
      });

      function activate(link) {
        var key = link.getAttribute("data-top");
        var frame = frameMap[key];
        if (!frame) return;

        tabs.querySelectorAll("a[data-top]").forEach(function (a) {
          a.classList.toggle("active", a === link);
        });
        frames.forEach(function (f) {
          f.classList.toggle("is-active", f === frame);
        });
      }

      tabs.addEventListener("click", function (e) {
        var link = e.target.closest("a[data-top]");
        if (!link) return;
        e.preventDefault();
        activate(link);
      });
    })();
  </script>
